# nginx devant VRC Sentinel Server (docker-compose.proxy.yml, serveur sur 127.0.0.1:8080).
# À placer dans /etc/nginx/sites-available/ puis activer ; certificat par certbot par exemple.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sentinel.exemple.fr;

    ssl_certificate     /etc/letsencrypt/live/sentinel.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sentinel.exemple.fr/privkey.pem;

    # Envois de synchronisation : jusqu'à 16 Mo (nginx refuse au-delà de 1 Mo par défaut).
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Adresse réelle du client (limites de débit, journal d'audit).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Attente longue de la synchronisation : 25 s au plus côté serveur.
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

# Sous un sous-chemin (PUBLIC_URL=https://exemple.fr/sentinel), dans le server{} existant :
#
#   location /sentinel/ {
#       proxy_pass http://127.0.0.1:8080;      # sans barre finale : le préfixe est transmis
#       client_max_body_size 16m;
#       proxy_http_version 1.1;
#       proxy_set_header Host $host;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#       proxy_read_timeout 60s;
#       proxy_buffering off;
#   }

server {
    listen 80;
    listen [::]:80;
    server_name sentinel.exemple.fr;
    return 301 https://$host$request_uri;
}
